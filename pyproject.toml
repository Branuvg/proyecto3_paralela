[project]
name = "proyecto3-paralela"
version = "0.1.0"
description = "Proyecto 3: aceleracion con CUDA del clasificador ASL (Lab 3 Data Science)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cuda-bindings>=12.9.8,<13",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numba-cuda[cu12]>=0.30.4",
    "numpy>=2.3,<2.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
    "torch>=2.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
